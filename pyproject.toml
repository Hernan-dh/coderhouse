[project]
name = "coderhouse"
version = "0.1.0"
description = "Cliente asíncrono unificado para OpenAI y Anthropic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40.0,<3.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
